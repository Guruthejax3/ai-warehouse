# ReplayTwin — local stack
#
#   docker compose up   # Postgres + API + dashboard (frontend)
#
# The backend falls back to SQLite when Postgres is unreachable — handy for a
# laptop demo. Postgres is the intended store: every assistant answer is
# sourced from the structured event log it holds (never free-generated).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: replaytwin
      POSTGRES_PASSWORD: replaytwin
      POSTGRES_DB: damage_dna
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U replaytwin -d damage_dna"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://replaytwin:replaytwin@postgres:5432/damage_dna
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports:
      - "8000:8000"
    volumes:
      - ./data/clips:/app/data/clips:ro
      - ./data/exemplars:/app/data/exemplars:ro
      - ./data/evidence_clips:/app/data/evidence_clips
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata: